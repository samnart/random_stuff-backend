# Application
spring.application.name=randomstuff-api
server.port=8080

# Database - H2 for development
spring.datasource.url=jdbc:h2:mem:randomstuff;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=randomstuff-super-secret-key-for-jwt-authentication-that-is-very-long-and-secure-2024
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://randomstuff.shop

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== EMAIL CONFIGURATION =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@randomstuff.shop}
app.mail.enabled=${MAIL_ENABLED:false}

# ===== AWS S3 CONFIGURATION =====
aws.s3.bucket=${AWS_S3_BUCKET:randomstuff-uploads}
aws.s3.region=${AWS_REGION:us-east-1}
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.s3.enabled=${AWS_S3_ENABLED:false}

# ===== STRIPE PAYMENT CONFIGURATION =====
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.enabled=${STRIPE_ENABLED:false}

# ===== INVENTORY SETTINGS =====
inventory.low-stock-threshold=10
inventory.critical-stock-threshold=3
inventory.check-interval-hours=1

# ===== RECOMMENDATIONS SETTINGS =====
recommendations.max-items=10
recommendations.min-orders-for-collaborative=5
