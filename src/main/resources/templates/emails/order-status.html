<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status Update</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #4F46E5; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background: #f9fafb; padding: 30px; border: 1px solid #e5e7eb; text-align: center; }
        .status-badge { display: inline-block; background: #10B981; color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; margin: 20px 0; }
        .message { background: white; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .btn { display: inline-block; background: #4F46E5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; margin-top: 15px; }
        .footer { text-align: center; padding: 20px; color: #6b7280; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Order Update</h1>
        <p>Order #<span th:text="${orderNumber}">ABC123</span></p>
    </div>

    <div class="content">
        <p>Hi <span th:text="${customerName}">Customer</span>,</p>

        <div class="status-badge" th:text="${status}">Shipped</div>

        <div class="message">
            <p th:text="${statusMessage}">Your order is on its way!</p>
        </div>

        <a href="#" class="btn">View Order Details</a>
    </div>

    <div class="footer">
        <p>Questions? Contact us at support@randomstuff.shop</p>
        <p>&copy; 2024 RandomStuff. All rights reserved.</p>
    </div>
</body>
</html>
