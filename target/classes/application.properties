# Application
spring.application.name=randomstuff-api
server.port=8080
 
# Database - H2 for development
spring.datasource.url=jdbc:h2:mem:randomstuff;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 
# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
 
# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# spring.jpa.show-sql=true
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.tool.hbm2ddl=DEBUG
 
# JWT
jwt.secret=randomstuff-super-secret-key-for-jwt-authentication-that-is-very-long-and-secure-2024
jwt.expiration=86400000
 
# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://randomstuff.shop
 
# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
